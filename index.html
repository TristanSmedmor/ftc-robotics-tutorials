<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FTC Team Tutorial Hub</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --code-bg: #090d16;
      --table-header: #0284c7;
      --success: #22c55e;
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #e2e8f0;
      --code-bg: #1e293b;
      --table-header: #0284c7;
      --success: #16a34a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Bar */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 1.5rem; color: var(--accent); }
    .header-actions { display: flex; gap: 12px; }

    button {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--border-color); color: var(--text-main); }

    /* Guide Selection Bar */
    .guide-selector-bar {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 32px;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      align-items: center;
    }
    .guide-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
    }
    .guide-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    /* Layout Container */
    .app-container {
      display: flex;
      flex: 1;
    }

    /* Sidebar Navigation */
    aside {
      width: 260px;
      background-color: var(--card-bg);
      border-right: 1px solid var(--border-color);
      padding: 24px 16px;
      height: calc(100vh - 120px);
      position: sticky;
      top: 120px;
      overflow-y: auto;
    }
    aside h2 { font-size: 1rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
    aside ul { list-style: none; }
    aside li { margin-bottom: 6px; }
    aside a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      display: block;
      padding: 8px 10px;
      border-radius: 6px;
    }
    aside a:hover, aside a.active {
      background-color: var(--accent);
      color: #ffffff;
    }

    /* Main Content Area */
    main {
      flex: 1;
      padding: 32px 40px;
      max-width: 900px;
    }

    .step-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 32px;
    }
    .step-badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    /* Code Block Containers */
    .code-container { position: relative; margin: 16px 0; }
    pre {
      background: var(--code-bg);
      color: #e2e8f0;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      font-family: monospace;
      font-size: 0.88rem;
    }
    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--accent);
      font-size: 0.75rem;
      padding: 4px 8px;
    }

    /* Tables */
    table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.9rem; }
    th, td { padding: 10px; border: 1px solid var(--border-color); text-align: left; }
    th { background-color: var(--table-header); color: #fff; }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 90%;
      max-width: 650px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.9rem; margin-bottom: 6px; color: var(--text-main); }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-main);
      font-family: inherit;
    }
    .form-group textarea { height: 120px; resize: vertical; }

    @media (max-width: 768px) {
      .app-container { flex-direction: column; }
      aside { width: 100%; height: auto; position: relative; top: 0; }
      main { padding: 20px; }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <h1>FTC Robotics Tutorials</h1>
    <div class="header-actions">
      <button onclick="openUploadModal()">+ Upload New Guide</button>
      <button class="btn-secondary" onclick="toggleTheme()">Theme</button>
    </div>
  </header>

  <!-- Guide Selection Bar -->
  <div class="guide-selector-bar" id="guideSelectorBar">
    <!-- Dynamic Guide Buttons Rendered Here -->
  </div>

  <!-- Main App Layout -->
  <div class="app-container">
    <!-- Sidebar Index for Active Guide -->
    <aside>
      <h2>Guide Index</h2>
      <ul id="guideSidebarIndex">
        <!-- Dynamic Step Links Rendered Here -->
      </ul>
    </aside>

    <!-- Main Tutorial Viewer -->
    <main id="guideContent">
      <!-- Active Guide Rendered Here -->
    </main>
  </div>

  <!-- Modal for Uploading / Adding New Guides -->
  <div class="modal-overlay" id="uploadModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Upload / Add New Guide</h2>
        <button class="btn-secondary" onclick="closeUploadModal()">✕</button>
      </div>
      <form id="guideForm" onsubmit="handleGuideUpload(event)">
        <div class="form-group">
          <label for="guideId">Guide ID (Unique, lowercase, e.g. 'autonomous-pid')</label>
          <input type="text" id="guideId" required placeholder="autonomous-pid">
        </div>
        <div class="form-group">
          <label for="guideTitle">Guide Title</label>
          <input type="text" id="guideTitle" required placeholder="Autonomous PID Tuning Guide">
        </div>
        <div class="form-group">
          <label for="step1Title">Step 1 Title</label>
          <input type="text" id="step1Title" required placeholder="Setting Up Odometry Sensors">
        </div>
        <div class="form-group">
          <label for="step1Content">Step 1 Content (HTML / Text)</label>
          <textarea id="step1Content" required placeholder="Enter instructions or HTML content here..."></textarea>
        </div>
        <div class="form-group">
          <label for="codeSnippet">Code Snippet (Optional)</label>
          <textarea id="codeSnippet" placeholder="// Paste Java code snippet here..."></textarea>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" class="btn-secondary" onclick="exportJSON()">Export JSON Code</button>
          <button type="submit">Save Guide to Browser</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Initial Tutorial Data Array
    const defaultGuides = [
      {
        id: "mecanum-onbotjava",
        title: "Mecanum OnBotJava Guide",
        steps: [
          {
            id: "step1",
            badge: "STEP 1",
            title: "Physical Wheel Mounting & Roller Configuration",
            content: `<p>Verify physical installation before writing code. Mecanum wheels feature 45-degree angled rollers that generate lateral forces when rotated[cite: 3].</p>
                      <ul>
                        <li><strong>Top View ("X" Pattern):</strong> Looking from directly above, top rollers contacting the floor MUST form an "X" shape across the chassis[cite: 3].</li>
                        <li><strong>Bottom View ("O" Pattern):</strong> Looking up from below, bottom rollers form an "O"[cite: 3]. If the top view forms an "O", swap left and right wheels immediately[cite: 3].</li>
                      </ul>`
          },
          {
            id: "step2",
            badge: "STEP 2",
            title: "Driver Station Hardware Configuration",
            content: `<p>Open Driver Station > Settings > Configure Robot[cite: 3]. Map motor ports with exact string names[cite: 3]:</p>
                      <table>
                        <thead><tr><th>Wheel Position</th><th>OnBotJava Motor Name</th><th>Control Hub Port</th><th>Direction Setup</th></tr></thead>
                        <tbody>
                          <tr><td>Front Left</td><td><code>frontLeft</code></td><td>Port 0</td><td><code>REVERSE</code></td></tr>
                          <tr><td>Back Left</td><td><code>backLeft</code></td><td>Port 1</td><td><code>REVERSE</code></td></tr>
                          <tr><td>Front Right</td><td><code>frontRight</code></td><td>Port 2</td><td><code>FORWARD</code></td></tr>
                          <tr><td>Back Right</td><td><code>backRight</code></td><td>Port 3</td><td><code>FORWARD</code></td></tr>
                        </tbody>
                      </table>`
          },
          {
            id: "step4",
            badge: "STEP 4",
            title: "Robot-Centric TeleOp Code",
            content: `<p>Copy and paste this starter Robot-Centric TeleOp code into OnBotJava[cite: 3]:</p>`,
            code: `package org.firstinspires.ftc.teamcode;

import com.qualcomm.robotcore.eventloop.opmode.LinearOpMode;
import com.qualcomm.robotcore.eventloop.opmode.TeleOp;
import com.qualcomm.robotcore.hardware.DcMotor;
import com.qualcomm.robotcore.hardware.DcMotorSimple;

@TeleOp(name = "Mecanum Robot-Centric", group = "Linear OpMode")
public class MecanumTeleOpRobotCentric extends LinearOpMode {
    @Override
    public void runOpMode() throws InterruptedException {
        DcMotor frontLeftMotor = hardwareMap.get(DcMotor.class, "frontLeft");
        DcMotor backLeftMotor = hardwareMap.get(DcMotor.class, "backLeft");
        DcMotor frontRightMotor = hardwareMap.get(DcMotor.class, "frontRight");
        DcMotor backRightMotor = hardwareMap.get(DcMotor.class, "backRight");

        frontLeftMotor.setDirection(DcMotorSimple.Direction.REVERSE);
        backLeftMotor.setDirection(DcMotorSimple.Direction.REVERSE);

        waitForStart();
        while (opModeIsActive()) {
            double y = -gamepad1.left_stick_y;
            double x = gamepad1.left_stick_x * 1.1;
            double rx = gamepad1.right_stick_x;

            double frontLeftPower = y + x + rx;
            double backLeftPower = y - x + rx;
            double frontRightPower = y - x - rx;
            double backRightPower = y + x - rx;

            frontLeftMotor.setPower(frontLeftPower);
            backLeftMotor.setPower(backLeftPower);
            frontRightMotor.setPower(frontRightPower);
            backRightMotor.setPower(backRightPower);
        }
    }
}`
          }
        ]
      },
      {
        id: "hardware-wiring",
        title: "REV Control Hub Wiring & Setup",
        steps: [
          {
            id: "hw-step1",
            badge: "STEP 1",
            title: "Power Distribution & Battery Connection",
            content: `<p>Connect your 12V Slim Battery directly to the XT30 power port on the REV Control Hub.</p>
                      <ul>
                        <li>Use a 20A inline switch between the battery and the Hub.</li>
                        <li>Ensure all wire crimps are tight and insulated with heat shrink.</li>
                      </ul>`
          }
        ]
      }
    ];

    // Load stored guides or fallback to defaults
    let guides = JSON.parse(localStorage.getItem("ftc_guides")) || defaultGuides;
    let activeGuideId = guides[0].id;

    // Render Guide Selector Buttons
    function renderGuideButtons() {
      const selectorBar = document.getElementById("guideSelectorBar");
      selectorBar.innerHTML = "";
      guides.forEach(guide => {
        const btn = document.createElement("button");
        btn.className = `guide-btn ${guide.id === activeGuideId ? "active" : ""}`;
        btn.innerText = guide.title;
        btn.onclick = () => switchGuide(guide.id);
        selectorBar.appendChild(btn);
      });
    }

    // Switch Active Guide
    function switchGuide(guideId) {
      activeGuideId = guideId;
      renderGuideButtons();
      renderActiveGuide();
    }

    // Render Active Guide Content & Sidebar Index
    function renderActiveGuide() {
      const guide = guides.find(g => g.id === activeGuideId);
      const sidebarIndex = document.getElementById("guideSidebarIndex");
      const contentArea = document.getElementById("guideContent");

      sidebarIndex.innerHTML = "";
      contentArea.innerHTML = `<h1>${guide.title}</h1><br>`;

      guide.steps.forEach(step => {
        // Sidebar link
        const li = document.createElement("li");
        li.innerHTML = `<a href="#${step.id}">${step.title}</a>`;
        sidebarIndex.appendChild(li);

        // Content section
        const section = document.createElement("section");
        section.className = "step-section";
        section.id = step.id;

        let codeHTML = "";
        if (step.code) {
          codeHTML = `
            <div class="code-container">
              <button class="copy-btn" onclick="copyCode('${step.id}-code')">Copy Code</button>
              <pre id="${step.id}-code">${escapeHTML(step.code)}</pre>
            </div>`;
        }

        section.innerHTML = `
          <span class="step-badge">${step.badge || 'STEP'}</span>
          <h2>${step.title}</h2>
          ${step.content}
          ${codeHTML}
        `;
        contentArea.appendChild(section);
      });
    }

    // Modal Control
    function openUploadModal() { document.getElementById("uploadModal").classList.add("active"); }
    function closeUploadModal() { document.getElementById("uploadModal").classList.remove("active"); }

    // Handle Adding New Guide
    function handleGuideUpload(event) {
      event.preventDefault();
      const id = document.getElementById("guideId").value.trim();
      const title = document.getElementById("guideTitle").value.trim();
      const step1Title = document.getElementById("step1Title").value.trim();
      const step1Content = document.getElementById("step1Content").value.trim();
      const codeSnippet = document.getElementById("codeSnippet").value.trim();

      const newGuide = {
        id: id,
        title: title,
        steps: [
          {
            id: `${id}-step1`,
            badge: "STEP 1",
            title: step1Title,
            content: `<p>${step1Content}</p>`,
            code: codeSnippet || undefined
          }
        ]
      };

      guides.push(newGuide);
      localStorage.setItem("ftc_guides", JSON.stringify(guides));
      closeUploadModal();
      switchGuide(id);
      document.getElementById("guideForm").reset();
    }

    // Export Guides Array as JSON so users can commit directly to repository
    function exportJSON() {
      const jsonStr = JSON.stringify(guides, null, 2);
      navigator.clipboard.writeText(jsonStr).then(() => {
        alert("Full guides JSON copied to clipboard! You can paste this directly into your codebase or data file.");
      });
    }

    // Copy Code Utility
    function copyCode(elementId) {
      const codeText = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(codeText).then(() => alert("Code copied to clipboard!"));
    }

    // Utility to escape HTML strings in pre blocks
    function escapeHTML(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Theme Toggle
    function toggleTheme() {
      if (document.body.getAttribute('data-theme') === 'light') {
        document.body.removeAttribute('data-theme');
      } else {
        document.body.setAttribute('data-theme', 'light');
      }
    }

    // Initialize App
    renderGuideButtons();
    renderActiveGuide();
  </script>
</body>
</html>
